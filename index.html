<!-- ======================================================================
     CORE: tuning constants + pure game logic (no rendering).
     Kept in a classic script so /tools can load it headlessly.
     ====================================================================== -->
<script id="pedro-core">
// ============================================================
//  CONFIG — every tuning constant lives here.
//  Units: distances shown to the player are miles, speeds are mph.
//  Internally 1 world unit = 1 meter.
// ============================================================
const CONFIG = {
  // --- Road & lanes ---
  lanes: 4,
  laneWidth: 3.6,              // meters
  startLane: 1,                // 0 = leftmost lane
  laneChangeMs: 150,           // eased lane-change tween duration

  // --- Speed (mph) ---
  startSpeedMph: 70,
  maxSpeedMph: 160,            // reached when difficulty hits 1

  // --- Difficulty curve: [miles, difficulty 0..1], linearly interpolated.
  //     ~0.6 mi ≈ 30 s (easy), ~3 mi ≈ 2 min (hard), ~7.5 mi ≈ 4 min (brutal).
  difficultyCurve: [[0, 0], [0.6, 0.1], [3.0, 0.6], [7.5, 1.0]],
  milestoneMiles: 3,           // "PEDRO MADE IT TO GAME NIGHT!"

  // --- Camera ---
  fovBase: 62,
  fovMax: 76,                  // FOV at max speed
  shakeMax: 0.14,              // camera shake amplitude at max speed (meters)
  camHeight: 4.7,
  camBack: 9.8,
  camLookAhead: 18,

  // --- Rendering / performance ---
  maxPixelRatio: 2,
  fogNear: 45,
  fogFar: 165,
  chunkLength: 30,             // road chunk length (meters); must be a multiple of dashPeriod
  chunkCount: 8,
  dashLength: 3,
  dashPeriod: 10,
  dtClamp: 1 / 30,             // max simulated seconds per frame (prevents tunneling)
};

// Game-over roast lines. {miles} and {score} are substituted.
const ROASTS = [
  "Another Jetta, another insurance claim.",
  "Pedro's new Jetta lasted {miles} miles.",
  "The group chat has been notified.",
];

// ============================================================
//  Pure helpers (shared with /tools)
// ============================================================
const PedroCore = (() => {
  const METERS_PER_MILE = 1609.344;
  const MPH_TO_MPS = 0.44704;

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

  // difficulty(distanceMiles) -> 0..1
  function difficulty(miles) {
    const pts = CONFIG.difficultyCurve;
    if (miles <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      if (miles <= pts[i][0]) {
        const t = (miles - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]);
        return lerp(pts[i - 1][1], pts[i][1], t);
      }
    }
    return pts[pts.length - 1][1];
  }

  function speedMph(miles) {
    return lerp(CONFIG.startSpeedMph, CONFIG.maxSpeedMph, difficulty(miles));
  }
  // speed in meters/second at a given distance (meters)
  function speedAt(meters) { return speedMph(meters / METERS_PER_MILE) * MPH_TO_MPS; }

  function laneX(i) { return (i - (CONFIG.lanes - 1) / 2) * CONFIG.laneWidth; }

  return { METERS_PER_MILE, MPH_TO_MPS, mulberry32, lerp, clamp01, difficulty, speedMph, speedAt, laneX };
})();
if (typeof window !== 'undefined') window.PedroCore = PedroCore;
</script>

<!-- ======================================================================
     GAME: rendering, input, loop.
     ====================================================================== -->
<script type="module">
import * as THREE from 'three';

const C = CONFIG;
const Core = PedroCore;
const { laneX, lerp } = Core;
const DEBUG = new URLSearchParams(location.search).has('debug');

// ---------- Persistent storage (guarded) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* private mode */ } },
};
let bestScore = parseInt(store.get('pedro.best', '0'), 10) || 0;

// ---------- Renderer / scene ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: window.devicePixelRatio < 2, powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, C.maxPixelRatio));

const scene = new THREE.Scene();
const FOG_COLOR = 0xd08a74;
scene.fog = new THREE.Fog(FOG_COLOR, C.fogNear, C.fogFar);
renderer.setClearColor(FOG_COLOR, 1);

const camera = new THREE.PerspectiveCamera(C.fovBase, 1, 0.5, C.fogFar + 40);

// Sky dome: vertex-colored gradient, follows the camera; horizon matches the fog color.
const sky = (() => {
  const g = new THREE.SphereGeometry(C.fogFar + 20, 24, 12);
  const top = new THREE.Color(0x10162e), mid = new THREE.Color(0x3a3f72), hor = new THREE.Color(FOG_COLOR);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / (C.fogFar + 20);
    if (y <= 0.02) c.copy(hor);
    else if (y < 0.22) c.copy(hor).lerp(mid, (y - 0.02) / 0.2);
    else c.copy(mid).lerp(top, Math.min(1, (y - 0.22) / 0.5));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  m.renderOrder = -1;
  scene.add(m);
  return m;
})();

scene.add(new THREE.HemisphereLight(0xc8d6ff, 0x3a2e28, 1.5));
const sun = new THREE.DirectionalLight(0xffe2c4, 1.7);
sun.position.set(-6, 12, -8);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fb4ff, 0.55);
fill.position.set(4, 6, 10);
scene.add(fill);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- Geometry helpers (vertex-colored, merged → 1 draw call) ----------
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _c = new THREE.Color();

function part(geo, color, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.applyMatrix4(_m4.compose(_v1.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _v2.set(1, 1, 1)));
  _c.set(color);
  const n = g.attributes.position.count, col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { col[i * 3] = _c.r; col[i * 3 + 1] = _c.g; col[i * 3 + 2] = _c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
function merge(parts) {
  let n = 0;
  for (const p of parts) n += p.attributes.position.count;
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
  let o = 0;
  for (const p of parts) {
    pos.set(p.attributes.position.array, o);
    nor.set(p.attributes.normal.array, o);
    col.set(p.attributes.color.array, o);
    o += p.attributes.position.count * 3;
    p.dispose();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeBoundingSphere();
  return g;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const plane = (w, d) => new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2);
const cyl = (rt, rb, h, s) => new THREE.CylinderGeometry(rt, rb, h, s);
function extrudeProfile(points, width) {
  // points: [z, y] side profile (front = -z). Extruded across x, centered.
  const s = new THREE.Shape();
  s.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) s.lineTo(points[i][0], points[i][1]);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: width, bevelEnabled: false });
  g.rotateY(-Math.PI / 2);
  g.translate(width / 2, 0, 0);
  return g;
}

const vcMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true, fog: false });

// ---------- Road chunks ----------
const ROAD_HALF = (C.lanes * C.laneWidth) / 2;
const SHOULDER = 2.4;
const RAIL_X = ROAD_HALF + SHOULDER + 0.3;
const L = C.chunkLength;

function buildRoadChunkGeometry() {
  const p = [];
  const zc = -L / 2;
  p.push(part(plane(80, L), 0x2f3b2c, 0, -0.06, zc));                       // grass
  p.push(part(plane(ROAD_HALF * 2 + SHOULDER * 2, L), 0x3b3c40, 0, 0, zc));  // shoulders
  p.push(part(plane(ROAD_HALF * 2, L), 0x232427, 0, 0.006, zc));             // asphalt (near-charcoal)
  p.push(part(plane(0.16, L), 0xe8c547, -ROAD_HALF + 0.15, 0.02, zc));        // left edge (yellow)
  p.push(part(plane(0.16, L), 0xe9e9e9, ROAD_HALF - 0.15, 0.02, zc));         // right edge (white)
  for (let i = 1; i < C.lanes; i++) {
    const x = -ROAD_HALF + i * C.laneWidth;
    for (let z = 0; z < L; z += C.dashPeriod) p.push(part(plane(0.14, C.dashLength), 0xdedede, x, 0.02, -z - C.dashLength / 2));
  }
  for (const side of [-1, 1]) {
    p.push(part(box(0.1, 0.32, L), 0xaab0b8, side * RAIL_X, 0.58, zc));
    p.push(part(box(0.06, 0.1, L), 0x6c7178, side * (RAIL_X + 0.03), 0.4, zc));
    for (let z = 0; z < L; z += 3) p.push(part(box(0.14, 0.7, 0.14), 0x6c7178, side * (RAIL_X + 0.1), 0.35, -z - 1.5));
  }
  return merge(p);
}

// Cosmetic RNG for scenery (separate from the gameplay seed)
const sceneryRng = Core.mulberry32(0xC0FFEE);
function buildSceneryVariant(r) {
  const p = [];
  for (const side of [-1, 1]) {
    const trees = 2 + Math.floor(r() * 4);
    for (let i = 0; i < trees; i++) {
      const x = side * (RAIL_X + 3.5 + r() * 16), z = -r() * L, s = 0.8 + r() * 0.9;
      const green = [0x2e5b37, 0x3a6b3c, 0x24502f, 0x4a7240][Math.floor(r() * 4)];
      p.push(part(cyl(0.18 * s, 0.24 * s, 1.4 * s, 6), 0x5a3d2b, x, 0.7 * s, z));
      p.push(part(cyl(0, 1.3 * s, 3.2 * s, 7), green, x, 1.4 * s + 1.6 * s, z));
      if (r() < 0.5) p.push(part(cyl(0, 1.0 * s, 2.4 * s, 7), green, x, 1.4 * s + 3.0 * s, z));
    }
  }
  if (r() < 0.55) { // light pole with arm over the shoulder
    const side = r() < 0.5 ? -1 : 1, z = -r() * L, x = side * (RAIL_X + 0.9);
    p.push(part(cyl(0.09, 0.12, 7.5, 6), 0x8a9098, x, 3.75, z));
    p.push(part(box(2.6, 0.12, 0.12), 0x8a9098, x - side * 1.3, 7.45, z));
    p.push(part(box(0.9, 0.18, 0.4), 0xfff1b8, x - side * 2.5, 7.35, z));
  }
  if (r() < 0.25) { // green highway sign
    const side = r() < 0.5 ? -1 : 1, z = -r() * L, x = side * (RAIL_X + 2.2);
    p.push(part(box(0.14, 3.2, 0.14), 0x8a9098, x - 1.3, 1.6, z));
    p.push(part(box(0.14, 3.2, 0.14), 0x8a9098, x + 1.3, 1.6, z));
    p.push(part(box(3.4, 1.6, 0.12), 0x1f7a45, x, 3.6, z));
    p.push(part(box(2.6, 0.18, 0.13), 0xf2f2f2, x, 3.95, z));
    p.push(part(box(1.8, 0.18, 0.13), 0xf2f2f2, x - 0.4, 3.45, z));
  }
  if (p.length === 0) p.push(part(box(0.01, 0.01, 0.01), 0x000000, 0, -1, 0));
  return merge(p);
}

const roadGeo = buildRoadChunkGeometry();
const sceneryVariants = [];
for (let i = 0; i < 8; i++) sceneryVariants.push(buildSceneryVariant(sceneryRng));

const chunks = [];
const CHUNK_BEHIND = 30; // chunk fully behind camera once its far edge passes this z
for (let i = 0; i < C.chunkCount; i++) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(roadGeo, vcMat));
  const sc = new THREE.Mesh(sceneryVariants[i % sceneryVariants.length], vcMat);
  g.add(sc);
  g.userData.scenery = sc;
  g.position.z = CHUNK_BEHIND - i * L;
  scene.add(g);
  chunks.push(g);
}
function scrollRoad(d) {
  for (let i = 0; i < chunks.length; i++) {
    const ch = chunks[i];
    ch.position.z += d;
    if (ch.position.z - L > CHUNK_BEHIND) {
      ch.position.z -= C.chunkCount * L;
      ch.userData.scenery.geometry = sceneryVariants[Math.floor(sceneryRng() * sceneryVariants.length)];
    }
  }
}

// ---------- Cars ----------
// Sedan side profile (front = -z). Body is vertex-colored white so material color tints it.
const SEDAN_BODY = [[-2.32, 0.30], [2.30, 0.30], [2.30, 0.80], [2.20, 0.96], [1.32, 1.00], [-1.22, 1.00], [-2.18, 0.86], [-2.34, 0.70]];
const SEDAN_GLASS = [[1.38, 0.99], [0.62, 1.42], [-0.42, 1.45], [-1.28, 0.99]];

function buildSedanParts() {
  const p = [];
  p.push(part(plane(2.3, 5.0), 0x0b0b0d, 0, 0.03, 0));                             // contact shadow
  p.push(part(extrudeProfile(SEDAN_BODY, 1.84), 0xffffff));
  p.push(part(extrudeProfile(SEDAN_GLASS, 1.56), 0x1a2030));
  p.push(part(box(1.46, 0.06, 1.02), 0xffffff, 0, 1.47, 0.08));                      // roof cap
  p.push(part(box(1.5, 0.16, 0.06), 0x15171a, 0, 0.62, -2.34));                      // grille
  p.push(part(box(1.86, 0.14, 0.08), 0x2a2c30, 0, 0.36, 2.31));                      // rear bumper
  p.push(part(box(1.86, 0.14, 0.08), 0x2a2c30, 0, 0.36, -2.33));                     // front bumper
  for (const x of [-0.86, 0.86]) for (const z of [-1.42, 1.42])
    p.push(part(cyl(0.36, 0.36, 0.26, 10), 0x111214, x, 0.36, z, 0, 0, Math.PI / 2));
  return p;
}
function buildSedanLights() {
  const p = [];
  for (const x of [-0.6, 0.6]) {
    p.push(part(box(0.52, 0.14, 0.05), 0xff1428, x, 0.86, 2.32));                    // taillights
    p.push(part(box(0.42, 0.12, 0.05), 0xfff6dc, x, 0.76, -2.35));                   // headlights
  }
  p.push(part(box(0.5, 0.05, 0.05), 0xff1428, 0, 0.95, 2.22));                         // 3rd brake light
  return merge(p);
}
const sedanGeo = merge(buildSedanParts());
const sedanLightsGeo = buildSedanLights();

// ---------- Player (Pedro's silver Jetta) ----------
const player = {
  group: new THREE.Group(),
  lane: C.startLane, fromX: laneX(C.startLane), x: laneX(C.startLane),
  t: 1, queued: 0, dir: 0, bump: 0, bumpT: 0,
};
{
  const silver = new THREE.MeshLambertMaterial({ color: 0xd4d8de, vertexColors: true, flatShading: true, emissive: 0x15181d });
  const body = new THREE.Mesh(sedanGeo, silver);
  const outline = new THREE.Mesh(sedanGeo, new THREE.MeshBasicMaterial({ color: 0x050507, side: THREE.BackSide }));
  outline.scale.set(1.06, 1.05, 1.03);
  const lights = new THREE.Mesh(sedanLightsGeo, glowMat);
  // Taillight + headlight glows (additive quads)
  const glowTex = makeGlowTexture();
  const tailGlowMat = new THREE.MeshBasicMaterial({ map: glowTex, color: 0xff2030, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  for (const x of [-0.6, 0.6]) {
    const gl = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.6), tailGlowMat);
    gl.position.set(x, 0.86, 2.4);
    player.group.add(gl);
  }
  const beamMat = new THREE.MeshBasicMaterial({ map: glowTex, color: 0xfff0c0, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false });
  for (const x of [-0.7, 0.7]) {
    const beam = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 9).rotateX(-Math.PI / 2), beamMat);
    beam.position.set(x * 1.1, 0.04, -7.2);
    player.group.add(beam);
  }
  player.group.add(outline, body, lights);
  player.body = body;
  scene.add(player.group);
}
function makeGlowTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function startLaneChange(dir) {
  const target = player.lane + dir;
  if (target < 0 || target >= C.lanes) { player.bump = dir; player.bumpT = 0.16; return; }
  player.fromX = player.x;
  player.lane = target;
  player.dir = dir;
  player.t = 0;
}
function requestLane(dir) {
  if (game.state !== 'play') return;
  if (player.t < 1) { player.queued = dir; return; }   // input buffer: one queued change
  startLaneChange(dir);
}
function updatePlayer(realDt) {
  if (player.t < 1) {
    player.t = Math.min(1, player.t + (realDt * 1000) / C.laneChangeMs);
    player.x = lerp(player.fromX, laneX(player.lane), easeInOut(player.t));
    if (player.t >= 1 && player.queued) { const q = player.queued; player.queued = 0; startLaneChange(q); }
  }
  let yaw = 0, roll = 0;
  if (player.t < 1) { const s = Math.sin(player.t * Math.PI); yaw = -player.dir * 0.16 * s; roll = player.dir * 0.05 * s; }
  let bx = 0;
  if (player.bumpT > 0) { player.bumpT -= realDt; bx = player.bump * Math.sin((player.bumpT / 0.16) * Math.PI) * 0.25; }
  player.group.position.set(player.x + bx, 0, 0);
  player.group.rotation.set(0, yaw, roll);
}

// ---------- Game state ----------
const game = {
  state: 'title',        // title | play | paused
  prevState: 'title',
  sigma: 0,              // meters traveled this run
  time: 0,
  score: 0,
  mph: C.startSpeedMph,
};

function resetRun() {
  game.sigma = 0; game.time = 0; game.score = 0;
  player.lane = C.startLane; player.x = player.fromX = laneX(C.startLane); player.t = 1; player.queued = 0;
}

function startRun() {
  resetRun();
  game.state = 'play';
  ui.title.classList.add('hidden');
  ui.hud.classList.remove('hidden');
}

function pause() {
  if (game.state !== 'play') return;
  game.prevState = game.state;
  game.state = 'paused';
  ui.pause.classList.remove('hidden');
}
function resume() {
  if (game.state !== 'paused') return;
  game.state = game.prevState;
  ui.pause.classList.add('hidden');
  lastFrame = performance.now();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', pause);

// ---------- UI ----------
const $ = (id) => document.getElementById(id);
const ui = {
  hud: $('hud'), title: $('titleScreen'), pause: $('pauseScreen'),
  score: $('hudScoreVal'), miles: $('hudMilesVal'), milesLabel: $('hudMilesLabel'), speed: $('hudSpeedVal'),
  titleBest: $('titleBest'), debug: $('debugPanel'),
};
ui.titleBest.textContent = 'Best: ' + bestScore.toLocaleString();
if (DEBUG) ui.debug.classList.remove('hidden');

const hudCache = { score: -1, miles: -1, mph: -1, past: null };
function updateHud() {
  const s = Math.floor(game.score);
  if (s !== hudCache.score) { hudCache.score = s; ui.score.textContent = s.toLocaleString(); }
  const miles = game.sigma / Core.METERS_PER_MILE;
  const past = miles >= C.milestoneMiles;
  if (past !== hudCache.past) { hudCache.past = past; ui.milesLabel.textContent = past ? 'PAST GAME NIGHT' : 'TO GAME NIGHT'; }
  const m = Math.floor(Math.abs(C.milestoneMiles - miles) * 100);
  if (m !== hudCache.miles) { hudCache.miles = m; ui.miles.textContent = (m / 100).toFixed(2) + ' mi'; }
  const mph = Math.round(game.mph);
  if (mph !== hudCache.mph) { hudCache.mph = mph; ui.speed.textContent = mph; }
}

// ---------- Input ----------
function onAnyStartInput() {
  if (game.state === 'title') { startRun(); return true; }
  if (game.state === 'paused') { resume(); return true; }
  return false;
}
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === ' ' || k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();
  if (onAnyStartInput()) return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') requestLane(-1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') requestLane(1);
  else if (k === 'Escape' || k === 'p' || k === 'P') pause();
});

const SWIPE_PX = 28;
const touch = { id: null, x0: 0, y0: 0, t0: 0, consumed: false };
window.addEventListener('touchstart', (e) => {
  if (e.target.closest && e.target.closest('button, a')) return;
  e.preventDefault();
  const t = e.changedTouches[0];
  touch.id = t.identifier; touch.x0 = t.clientX; touch.y0 = t.clientY; touch.t0 = performance.now(); touch.consumed = false;
  if (onAnyStartInput()) touch.consumed = true;
}, { passive: false });
window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (touch.consumed || touch.id === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== touch.id) continue;
    const dx = t.clientX - touch.x0, dy = t.clientY - touch.y0;
    if (Math.abs(dx) > SWIPE_PX && Math.abs(dx) > Math.abs(dy)) { touch.consumed = true; requestLane(dx > 0 ? 1 : -1); }
  }
}, { passive: false });
window.addEventListener('touchend', (e) => {
  if (e.target.closest && e.target.closest('button, a')) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== touch.id) continue;
    if (!touch.consumed) requestLane(t.clientX < window.innerWidth / 2 ? -1 : 1);   // tap left/right half
    touch.id = null;
  }
}, { passive: false });
window.addEventListener('touchcancel', () => { touch.id = null; });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
// Mouse (desktop) — click left/right half, or click to start
window.addEventListener('mousedown', (e) => {
  if (e.target.closest && e.target.closest('button, a')) return;
  if (onAnyStartInput()) return;
  requestLane(e.clientX < window.innerWidth / 2 ? -1 : 1);
});

// ---------- Camera ----------
const camLook = new THREE.Vector3();
function updateCamera(dt, speedFrac) {
  const fov = lerp(C.fovBase, C.fovMax, speedFrac);
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  const shake = game.state === 'play' ? C.shakeMax * speedFrac * speedFrac : 0;
  const t = game.time;
  const sx = shake * (Math.sin(t * 37.1) * 0.6 + Math.sin(t * 23.7) * 0.4);
  const sy = shake * (Math.sin(t * 41.3) * 0.5 + Math.sin(t * 29.9) * 0.5);
  camera.position.set(player.x * 0.55 + sx, C.camHeight + sy, C.camBack);
  camLook.set(player.x * 0.75, 0.9, -C.camLookAhead);
  camera.lookAt(camLook);
  sky.position.copy(camera.position);
}

// ---------- Main loop ----------
let lastFrame = performance.now();
let fpsAcc = 0, fpsFrames = 0, fps = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let realDt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (realDt > C.dtClamp) realDt = C.dtClamp;
  if (realDt < 0) realDt = 0;
  fpsAcc += realDt; fpsFrames++;
  if (fpsAcc >= 0.5) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; }
  update(realDt);
  renderer.render(scene, camera);
}

function update(realDt) {
  if (game.state === 'paused') return;
  const miles = game.sigma / Core.METERS_PER_MILE;
  if (game.state === 'play') {
    const dt = realDt;
    game.mph = Core.speedMph(miles);
    const v = game.mph * Core.MPH_TO_MPS;
    const d = v * dt;
    game.sigma += d;
    game.time += dt;
    scrollRoad(d);
    updatePlayer(realDt);
    updateHud();
  } else {
    // Title: idle cruise
    game.time += realDt;
    scrollRoad(realDt * 22);
    updatePlayer(realDt);
  }
  const speedFrac = (game.mph - C.startSpeedMph) / (C.maxSpeedMph - C.startSpeedMph);
  updateCamera(realDt, game.state === 'play' ? speedFrac : 0);
  if (DEBUG) updateDebug(miles);
}

function updateDebug(miles) {
  ui.debug.textContent =
    `fps ${fps.toFixed(0)}  state ${game.state}\n` +
    `miles ${miles.toFixed(3)}  diff ${Core.difficulty(miles).toFixed(2)}\n` +
    `mph ${game.mph.toFixed(1)}  lane ${player.lane}`;
}

// ---------- Test hook (read-only snapshot + render probe) ----------
window.__pedro = {
  ready: true,
  snapshot() {
    return { state: game.state, lane: player.lane, x: player.x, tweening: player.t < 1, mph: game.mph,
      miles: game.sigma / Core.METERS_PER_MILE, score: game.score };
  },
  renderProbe() {
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const px = new Uint8Array(4);
    const seen = new Set();
    let opaque = 0;
    for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++) {
      gl.readPixels(Math.floor((i + 0.5) * w / 12), Math.floor((j + 0.5) * h / 12), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      if (px[3] > 0) opaque++;
      seen.add((px[0] >> 3) + ',' + (px[1] >> 3) + ',' + (px[2] >> 3));
    }
    return { w, h, opaque, distinctColors: seen.size };
  },
};

requestAnimationFrame(frame);
</script>
</body>
</html>
